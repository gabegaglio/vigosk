# Optional drop-in: /etc/systemd/system/vigosk-agent.service.d/privileged.conf
#
# Lets the agent report LVM thin-pool usage (Proxmox "local-lvm" /
# pve/data), which the kernel only reveals to root via device-mapper.
# The service still runs sandboxed: the ONLY capability it keeps is
# CAP_SYS_ADMIN (needed for the device-mapper query), it can only read
# block devices, and the filesystem stays read-only.
#
# Installed by:  install.sh --privileged
# Remove with:   rm this file && systemctl daemon-reload && systemctl restart vigosk-agent
[Service]
DynamicUser=no
User=root
Group=root
CapabilityBoundingSet=CAP_SYS_ADMIN
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=block-* r
DeviceAllow=/dev/mapper/control rw
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
SystemCallFilter=
SystemCallFilter=@system-service
